<!DOCTYPE html>
<html lang="id">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timeline Builder — Lagio Toolkit</title>
<style>
/* Tata letak: kolom form di kiri, preview halaman 1080x1920 menempel di kanan. */
:root{
  --bg:#E5E3E1; --panel:#F4F2F0; --panel-2:#ECEAE7; --ink:#2C3E50; --text:#3A3D3F;
  --muted:#66645F; --line:#CDC9C3; --silver:#A8A39C;
  --warn:#7A5200; --warn-bg:#FBF0D9; --err:#9B2F27; --err-bg:#F7E0DC; --ok:#2B6249; --ok-bg:#DDEEE5;
  --info:#44566A; --info-bg:#E3E9EF;
  --font:Karla, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 var(--font)}
body{min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
h1,h2,h3,p{margin:0}

.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.mark{width:14px;height:14px;background:var(--ink);box-shadow:0 22px 0 -2px var(--silver)}
.brand h1{font-size:20px;font-weight:700;color:var(--ink);line-height:1.1}
.brand p{font-size:13px;color:var(--muted)}
.status{font-size:13px;min-height:1.2em;color:var(--muted)}
.status.err{color:var(--err)} .status.ok{color:var(--ok)}

.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:6px;padding:9px 16px;font-weight:700;cursor:pointer}
.btn:hover{background:#22313f}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--panel-2)}
.btn.small{padding:6px 10px;font-size:13px}
.link{background:none;border:0;color:var(--ink);text-decoration:underline;cursor:pointer;padding:4px 0;font-size:13px;justify-self:start}

.wrap{max-width:1240px;margin:0 auto;padding:16px;display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
@media (min-width:960px){.wrap{grid-template-columns:minmax(380px,540px) minmax(0,1fr);align-items:start}}

.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;gap:12px}
.card + .card{margin-top:0}
.col{display:grid;gap:16px}
.card h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.head-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.head-row h2{margin-right:auto}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}
label.fld{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px 10px;color:var(--text)}
textarea{resize:vertical;line-height:1.4}
details{border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;font-weight:700;color:var(--ink);padding:4px 0}
details > .grid{display:grid;gap:12px;padding-top:8px}
.small-note{font-size:12.5px;color:var(--muted)}
.file-btns{display:flex;gap:8px;flex-wrap:wrap}

/* Daftar blok */
#blocks{display:grid;gap:8px}
.row,.blk{background:#fff;border:1px solid var(--line);border-radius:8px;position:relative}
.row.sub{margin-left:0}
.blk.group{border-left:4px solid var(--silver);background:var(--panel-2);padding:0}
.blk.group > .row-main{padding:8px 8px 4px}
.subs{display:grid;gap:6px;padding:4px 8px 4px 24px}
.sub-add{display:flex;gap:8px;padding:6px 8px 10px 24px;flex-wrap:wrap}
.sub-add input{flex:1 1 160px;min-width:0}
.paste-box{padding:0 8px 10px 24px;display:grid;gap:8px}
.paste-box[hidden]{display:none}
.empty{color:var(--muted);font-size:13px;padding:6px 4px}
.row-main{display:flex;align-items:center;gap:6px}
.m-item{display:grid;grid-template-columns:24px minmax(0,1fr) auto;grid-template-areas:"grip name days" "grip when tools";gap:2px 8px;align-items:center}
.m-item .grip{grid-area:grip;align-self:start;margin-top:2px}
.m-item .f-name{grid-area:name}
.m-item .days{grid-area:days}
.m-item .when{grid-area:when;padding-left:2px}
.m-item .tools{grid-area:tools;display:flex;gap:2px;justify-content:flex-end}
.row.item:not(.sub){border-left:4px solid var(--ink)}
.row.sub{border-left:4px solid var(--silver)}
.row.gap{border-style:dashed;background:transparent}
.row .row-main{padding:8px}
.namecell{flex:1;min-width:0;display:grid;gap:2px}
.when{font-size:12.5px;color:var(--muted);min-height:1em;font-variant-numeric:tabular-nums}
.f-name{font-weight:700;color:var(--ink)}
.tag{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--ink)}
.tag.mute{color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted)}
.days{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--muted)}
.days input{width:58px;text-align:center;font-variant-numeric:tabular-nums}
.days input:disabled{background:var(--panel-2);color:var(--muted)}
.icon{width:32px;height:32px;display:grid;place-items:center;border:1px solid transparent;background:transparent;border-radius:6px;color:var(--muted);cursor:pointer;flex:none}
.icon:hover{background:var(--panel-2);color:var(--ink)}
.icon.on{color:var(--ink);background:var(--panel-2);border-color:var(--line)}
.icon.danger:hover{color:var(--err);background:var(--err-bg)}
.grip{width:24px;height:32px;display:grid;place-items:center;border:0;background:transparent;color:var(--silver);cursor:grab;flex:none;fill:currentColor;border-radius:4px}
.grip:hover{color:var(--ink)} .grip:active{cursor:grabbing}
.row-detail{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px 12px;padding:0 8px 10px;align-items:end;font-size:12.5px;color:var(--muted);font-weight:600}
.row-detail[hidden]{display:none}
.row-detail label{display:grid;gap:3px}
.row-detail .link{grid-column:1/-1}
.dragging{opacity:.45}
.drop-before::before,.drop-after::after{content:"";position:absolute;left:0;right:0;height:3px;background:var(--ink);border-radius:2px;z-index:2}
.drop-before::before{top:-5px}.drop-after::after{bottom:-5px}
.drop-into{outline:2px dashed var(--ink);outline-offset:2px}

.issues{display:grid;gap:4px;padding:0 8px}
.issues:empty{display:none}
.issues:not(:empty){padding-bottom:8px}
.iss{font-size:12.5px;border-radius:5px;padding:5px 8px;margin:0}
.iss.warn{background:var(--warn-bg);color:var(--warn)}
.iss.err{background:var(--err-bg);color:var(--err)}
.iss.info{background:var(--info-bg);color:var(--info)}
#alerts{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.pill{font-size:12px;font-weight:700;border-radius:99px;padding:3px 10px}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)}

/* Preview */
.preview{position:sticky;top:76px;display:grid;gap:10px;justify-items:center}
@media (max-width:959px){.preview{position:static}}
.tabs{display:flex;gap:4px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:3px}
.tabs button{border:0;background:transparent;padding:6px 14px;border-radius:6px;font-weight:700;color:var(--muted);cursor:pointer}
.tabs button[aria-selected=true]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.sum{font-size:13px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.frame{box-shadow:0 8px 30px rgba(44,62,80,.18);border-radius:2px;background:#E5E3E1;line-height:0}
#preview{display:block;aspect-ratio:9/16;height:calc(100vh - 220px);max-height:820px;min-height:320px;width:auto;max-width:100%}
@media (max-width:959px){#preview{height:auto;width:min(100%,440px)}}
@media (prefers-reduced-motion:no-preference){.btn,.icon{transition:background .12s}}
</style>
<style id="lagio-shell">
:root{--lg-navy:#2F3741;--lg-navy-hover:#232A32;--lg-sand:#959280;--lg-bg:#F7F6F2;--lg-border:#E6E2DA;--lg-text:#1B2430;--lg-muted:#6B7280}
.lg-shell{display:flex;align-items:center;gap:12px;height:52px;padding:0 20px;background:#fff;color:var(--lg-text);border-bottom:1px solid var(--lg-border);box-shadow:none;position:sticky;top:0;z-index:200;box-sizing:border-box;justify-content:flex-start;font-family:'Karla',-apple-system,'Segoe UI',sans-serif}
.lg-back{color:var(--lg-muted);text-decoration:none;font-size:13px}
.lg-back:hover{color:var(--lg-text)}
.lg-div{width:1px;height:18px;background:var(--lg-border);flex-shrink:0}
.lg-name{font-weight:700;font-size:15px;color:var(--lg-text);letter-spacing:0}
.lg-actions{margin-left:auto;display:flex;align-items:center;gap:8px}

:root{--bg:#F7F6F2;--panel:#fff;--panel-2:#F3F1EC;--ink:#2F3741;--text:#1B2430;--muted:#6B7280;--line:#E6E2DA;--silver:#959280}
.btn{border-radius:8px}
.btn:hover{background:var(--lg-navy-hover)}
.btn.ghost{background:#fff;border-color:#D9D5CB}
.btn.ghost:hover{background:var(--lg-bg)}
.card{border-radius:12px}
.card h2{text-transform:none;letter-spacing:0;font-size:15px;color:var(--text)}
.preview{top:68px}
.lg-actions .status{max-width:320px;text-align:right}
</style>
</head>
<body>
<div class="lg-shell"><a class="lg-back" href="./index.html" id="lgBack">&larr; Toolkit</a><span class="lg-div"></span><svg class="lg-logo" viewBox="612 402 713 1127" width="13" height="21" aria-hidden="true"><polygon fill="#2F3741" points="612,1114 1325,402 1325,816 612,1529"/><polygon fill="#959280" points="978,1236 1325,1236 1325,1529 686,1529"/></svg><span class="lg-name">Timeline Builder</span><div class="lg-actions"><span id="status" class="status" role="status" aria-live="polite"></span><button type="button" class="btn small ghost" id="btn-save">Simpan</button><button type="button" class="btn small ghost" id="btn-load">Muat</button><input type="file" id="file-load" accept=".json,application/json" hidden><button type="button" class="btn small" id="btn-pdf" disabled>Unduh PDF</button></div></div>

<main class="wrap">
  <div class="col">
    <section class="card" aria-labelledby="h-proyek">
      <h2 id="h-proyek">Proyek</h2>
      <div class="grid2">
        <label class="fld" for="f-client">Nama klien<input type="text" id="f-client" autocomplete="off"></label>
        <label class="fld" for="f-location">Lokasi<input type="text" id="f-location" autocomplete="off"></label>
      </div>
      <label class="fld" for="f-start">Tanggal mulai<input type="date" id="f-start"></label>
      <details>
        <summary>Lanjutan</summary>
        <div class="grid">
          <label class="fld" for="collection">Judul koleksi di cover<input type="text" id="collection" placeholder="Collection Q- -" autocomplete="off"></label>
          <label class="fld" for="f-notes">Catatan di bawah timeline (satu baris per catatan)<textarea id="f-notes" rows="5"></textarea></label>
          <label class="fld" for="f-holidays">Libur tambahan, mis. cuti bersama (YYYY-MM-DD, pisahkan dengan koma atau baris baru)<textarea id="f-holidays" rows="2" placeholder="2027-03-08, 2027-03-09"></textarea></label>
          <p class="small-note">Data libur nasional bawaan mencakup 2025 sampai 2027.</p>
        </div>
      </details>
    </section>

    <section class="card" aria-labelledby="h-susunan">
      <div class="head-row">
        <h2 id="h-susunan">Susunan jadwal</h2>
        <label class="fld" for="preset" style="display:block"><span class="visually-hidden" style="position:absolute;left:-9999px">Mulai dari preset</span>
          <select id="preset" aria-label="Mulai dari preset">
            <option value="">Ganti dengan preset…</option>
            <option value="interior">Preset Interior</option>
            <option value="arch">Preset Arsitektur</option>
            <option value="empty">Kosongkan</option>
          </select></label>
        <button type="button" class="btn small ghost" id="btn-undo" disabled>Urungkan</button>
      </div>
      <p class="small-note">Seret pegangan di kiri untuk mengubah urutan atau memindahkan ruangan antar grup. Di layar sentuh, pakai panah dan menu Posisi pada ikon kalender.</p>
      <div id="blocks"></div>
      <div class="head-row">
        <button type="button" class="btn small" id="add-item">+ Milestone</button>
        <button type="button" class="btn small" id="add-group">+ Grup ruangan</button>
        <button type="button" class="btn small ghost" id="add-gap">+ Jeda</button>
      </div>
    </section>

    <section class="card" aria-labelledby="h-cek">
      <div class="head-row"><h2 id="h-cek">Pengecekan</h2><span id="alert-count" class="pill ok">Jadwal aman</span></div>
      <ul id="alerts"></ul>
    </section>
  </div>

  <aside class="preview" aria-label="Preview">
    <div class="tabs" role="tablist" aria-label="Halaman">
      <button type="button" role="tab" data-page="0" aria-selected="false">Cover</button>
      <button type="button" role="tab" data-page="1" aria-selected="true">Timeline</button>
      <button type="button" role="tab" data-page="2" aria-selected="false">Penutup</button>
    </div>
    <div class="frame"><canvas id="preview" width="810" height="1440" aria-label="Preview halaman PDF"></canvas></div>
    <p class="sum" id="summary"></p>
  </aside>
</main>

    if (ds) {
      s = ds;
      if (de) {
        if (de < ds) { addIssue('err', 'Tanggal selesai lebih awal dari tanggal mulai.'); e = ds; }
        else e = de;
      } else if (days !== null) {
        e = days <= 1 ? s : cal.advance(s, days)[1];

    if (ds && de) count = cal.countInclusive(s, e);          // dihitung nyata, bukan angka ketikan
    else count = days !== null ? days : cal.countInclusive(s, e);

      if (alt <= s) addIssue('warn', 'Tanggal alternatif harus setelah tanggal mulai.');

  // blocks: [{type:'item'|'group'|'gap', id, name, days, date_start, date_end, date_alt, items?}]
  function schedule(blocks, startISO, cal) {

    function add(id, level, msg) { (issues[id] = issues[id] || []).push({ level: level, msg: msg }); }

    if (!start0) return { rows: rows, issues: issues, start: null, end: null };
    var start = cal.nextWorking(start0);

    function pushItem(b, kind, indent) {
      var r = scheduleOne(b, cursor, cal, function (lv, msg) { add(b.id, lv, msg); });
      cursor = r.cursor;
      var last = r.alt && r.alt > r.e ? r.alt : r.e;
      if (last > endMax) endMax = last;
      rows.push({ id: b.id, kind: kind, name: b.name || '', s: r.s, e: r.e, alt: r.alt,
                  days: r.count, indent: indent });
    }

    blocks.forEach(function (b) {
      if (b.type === 'gap') {
        var g = toDays(b.days) || 1;
        cursor = cal.addWorking(cursor, g);
      } else if (b.type === 'group') {
        rows.push({ id: b.id, kind: 'group-header', name: b.name || '', s: null, e: null,

        (b.items || []).forEach(function (it) { pushItem(it, 'group-item', true); });

    } else {
      T(fmtDay(row.s), 0, 0, 'Bold', 28, C.BODY, 'left');
      T(fmtMonYear(row.s), 0, -32, 'Regular', 16, C.MUTED, 'left');
      T('-', 42, 0, 'Regular', 28, C.MUTED, 'left');
      T(fmtDay(row.e), 70, 0, 'Bold', 28, C.BODY, 'left');

  // model: {client_name, client_location, collection, notes[]}
  // sched: hasil schedule(); measure(s, font, size) -> lebar
  function buildPages(model, sched, measure) {

    cover.push({ t: 'text', s: collection, x: PAGE_W / 2, y: PAGE_H - 450, font: 'Italic', size: 34, c: C.MUTED, align: 'center' });

    var tl = [{ t: 'rect', x: 0, y: 0, w: PAGE_W, h: PAGE_H, c: C.BG }];

<script>/* Backend render: memutar ulang "ops" dari TLCore.buildPages.

(function (root) {
  'use strict';
  var PAGE_W = 1080, PAGE_H = 1920;

  /* ---------- Canvas (preview) ---------- */
  var CANVAS_FONT = {
    Regular: '400 {s}px Karla, Helvetica, Arial, sans-serif',
    SemiBold: '600 {s}px Karla, Helvetica, Arial, sans-serif',
    Bold: '700 {s}px Karla, Helvetica, Arial, sans-serif',
    Italic: 'italic 400 {s}px Karla, Helvetica, Arial, sans-serif'
  };
  function canvasFont(font, size) { return CANVAS_FONT[font].replace('{s}', size); }

  function canvasMeasurer() {
    var c = document.createElement('canvas').getContext('2d');
    return function (s, font, size) { c.font = canvasFont(font, size); return c.measureText(s).width; };
  }

  // images: { front: HTMLImageElement, back: HTMLImageElement }
  function drawCanvas(canvas, ops, images, scale) {
    canvas.width = Math.round(PAGE_W * scale);
    canvas.height = Math.round(PAGE_H * scale);
    var ctx = canvas.getContext('2d');
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.fillStyle = '#E5E3E1';
    ctx.fillRect(0, 0, PAGE_W, PAGE_H);
    ctx.textBaseline = 'alphabetic';
    ops.forEach(function (o) {
      if (o.t === 'img') {
        var im = images[o.key];
        if (im) ctx.drawImage(im, 0, 0, PAGE_W, PAGE_H);
      } else if (o.t === 'rect') {
        ctx.fillStyle = o.c;
        ctx.fillRect(o.x, PAGE_H - o.y - o.h, o.w, o.h);
      } else if (o.t === 'line') {
        ctx.strokeStyle = o.c; ctx.lineWidth = o.w;
        ctx.beginPath(); ctx.moveTo(o.x1, PAGE_H - o.y1); ctx.lineTo(o.x2, PAGE_H - o.y2); ctx.stroke();
      } else if (o.t === 'text') {
        ctx.font = canvasFont(o.font, o.size);
        ctx.fillStyle = o.c;
        ctx.textAlign = o.align;
        ctx.fillText(o.s, o.x, PAGE_H - o.y);
      }
    });
  }

  /* ---------- jsPDF ---------- */
  var PDF_FONT = {
    Regular: ['Karla', 'normal'], Bold: ['Karla', 'bold'], Italic: ['Karla', 'italic'],
    SemiBold: ['KarlaSemiBold', 'normal']
  };
  var FONT_FILES = {
    Regular: 'Karla-Regular.ttf', Bold: 'Karla-Bold.ttf', Italic: 'Karla-Italic.ttf',
    SemiBold: 'Karla-SemiBold.ttf'
  };

  // fontB64: { Regular, Bold, Italic, SemiBold } base64 TTF; imgB64: { front, back } base64 JPEG
  function setupPdf(JsPDF, fontB64) {
    var doc = new JsPDF({ unit: 'pt', format: [PAGE_W, PAGE_H], orientation: 'portrait', compress: true });
    Object.keys(FONT_FILES).forEach(function (k) {
      doc.addFileToVFS(FONT_FILES[k], fontB64[k]);
      doc.addFont(FONT_FILES[k], PDF_FONT[k][0], PDF_FONT[k][1]);
    });
    return doc;
  }

  function pdfMeasurer(doc) {
    return function (s, font, size) {
      doc.setFont(PDF_FONT[font][0], PDF_FONT[font][1]);
      doc.setFontSize(size);
      return doc.getTextWidth(s);
    };
  }

  function drawPdfPage(doc, ops, imgB64) {
    doc.setFillColor('#E5E3E1');
    doc.rect(0, 0, PAGE_W, PAGE_H, 'F');
    ops.forEach(function (o) {
      if (o.t === 'img') {
        doc.addImage(imgB64[o.key], 'JPEG', 0, 0, PAGE_W, PAGE_H, o.key, 'FAST');
      } else if (o.t === 'rect') {
        doc.setFillColor(o.c);
        doc.rect(o.x, PAGE_H - o.y - o.h, o.w, o.h, 'F');
      } else if (o.t === 'line') {
        doc.setDrawColor(o.c); doc.setLineWidth(o.w);
        doc.line(o.x1, PAGE_H - o.y1, o.x2, PAGE_H - o.y2);
      } else if (o.t === 'text') {
        doc.setFont(PDF_FONT[o.font][0], PDF_FONT[o.font][1]);
        doc.setFontSize(o.size);
        doc.setTextColor(o.c);
        doc.text(o.s, o.x, PAGE_H - o.y, { align: o.align, baseline: 'alphabetic' });
      }
    });
  }

  function buildPdf(JsPDF, fontB64, imgB64, pages, meta) {
    var doc = setupPdf(JsPDF, fontB64);
    pages.forEach(function (ops, i) {
      if (i > 0) doc.addPage([PAGE_W, PAGE_H], 'portrait');
      drawPdfPage(doc, ops, imgB64);
    });
    if (meta) doc.setProperties(meta);
    return doc;
  }

  var api = { canvasMeasurer: canvasMeasurer, drawCanvas: drawCanvas, setupPdf: setupPdf,
              pdfMeasurer: pdfMeasurer, drawPdfPage: drawPdfPage, buildPdf: buildPdf };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.TLBackends = api;
})(typeof window !== 'undefined' ? window : this);

  /* ---------- aksi ---------- */
  function moveBy(id, dir) {
    var L = locate(id); if (!L) return;
    var j = L.idx + dir;
    pushHistory();
    if (j >= 0 && j < L.list.length) {
      var t = L.list[L.idx]; L.list[L.idx] = L.list[j]; L.list[j] = t;
    } else if (L.parent) {
      L.list.splice(L.idx, 1);
      var pi = state.blocks.indexOf(L.parent);
      state.blocks.splice(dir < 0 ? pi : pi + 1, 0, L.obj);
    } else { history.pop(); syncUndo(); return; }
    renderAll();
  }
  function remove(id) {
    var L = locate(id); if (!L) return;
    pushHistory(); L.list.splice(L.idx, 1); renderAll();
  }
  function moveTo(id, dest) {
    var L = locate(id); if (!L || L.obj.type === 'group') return;
    pushHistory();
    L.list.splice(L.idx, 1);
    if (dest === 'top') {
      var pi = L.parent ? state.blocks.indexOf(L.parent) : state.blocks.length - 1;
      state.blocks.splice(pi + 1, 0, L.obj);
    } else {
      var g = locate(dest); if (g && g.obj.type === 'group') g.obj.items.push(L.obj);
    }
    renderAll();
  }
  function addSub(gid, text) {
    var g = locate(gid); if (!g) return;
    var name = (text || '').trim(); if (!name) return;
    pushHistory();
    var it = mkItem(name, 1); g.obj.items.push(it);
    focusId = 'add-' + gid; renderAll();
  }
  function parseList(text) {
    var out = [];
    String(text).split(/\r?\n/).forEach(function (line) {
      var s = line.replace(/^\s*(?:[-*•]|\d+[.)])\s*/, '').trim();
      if (!s) return;
      var m = /^(.*?)\s*(?:\||;|,|\s-\s)\s*(\d{1,2})\s*(?:hari|hr|d|days?)?\s*$/i.exec(s);
      if (m && m[1].trim()) out.push({ name: m[1].trim(), days: Math.max(1, +m[2]) });
      else out.push({ name: s, days: 1 });
    });
    return out;
  }
  function pasteApply(gid, text) {
    var g = locate(gid); if (!g) return;
    var list = parseList(text); if (!list.length) return;
    pushHistory();
    list.forEach(function (x) { g.obj.items.push(mkItem(x.name, x.days)); });
    renderAll();
  }

  /* ---------- drag & drop ---------- */
  var dragId = null;
  function clearDrop() {
    $$('.drop-before,.drop-after,.drop-into').forEach(function (e) {

  }
  function dropTarget(e) {
    var row = e.target.closest('.row[data-id]');
    var grp = e.target.closest('.blk.group');
    var drag = locate(dragId); if (!drag) return null;
    var isGroup = drag.obj.type === 'group';
    if (row) {
      if (row.dataset.id === dragId) return null;
      var tl = locate(row.dataset.id);
      if (isGroup && tl && tl.parent) {              // grup tidak boleh bersarang: arahkan ke grup induknya
        var ge = $('.blk.group[data-id="' + tl.parent.id + '"]');
        if (!ge || tl.parent.id === dragId) return null;
        var r1 = ge.getBoundingClientRect();
        return { type: e.clientY < r1.top + r1.height / 2 ? 'before' : 'after', id: tl.parent.id, el: ge };
      }
      var r = row.getBoundingClientRect();
      return { type: e.clientY < r.top + r.height / 2 ? 'before' : 'after', id: row.dataset.id, el: row };
    }
    if (grp) {
      if (grp.dataset.id === dragId) return null;
      if (isGroup) {
        var rg = grp.getBoundingClientRect();
        return { type: e.clientY < rg.top + rg.height / 2 ? 'before' : 'after', id: grp.dataset.id, el: grp };
      }
      var head = e.target.closest('.ghead');
      if (head) {
        var rh = head.getBoundingClientRect();
        if (e.clientY < rh.top + rh.height / 2) return { type: 'before', id: grp.dataset.id, el: grp };
        return { type: 'into', id: grp.dataset.id, where: 'start', el: grp };
      }
      return { type: 'into', id: grp.dataset.id, where: 'end', el: grp };
    }

  }
  function applyDrop(t) {
    var src = locate(dragId); if (!src || !t) return;

      if (!chk || t.id === dragId) return;
      if (obj.type === 'group' && chk.parent && chk.parent.id === dragId) return;

    pushHistory();
    src.list.splice(src.idx, 1);
    if (t.type === 'into') {
      var g = locate(t.id).obj;
      g.items.splice(t.where === 'start' ? 0 : g.items.length, 0, obj);

  }

  function parseExtraHolidays() {
    var out = {};
    String(state.extra_holidays || '').split(/[\s,;]+/).forEach(function (s) {
      if (Core.parseISO(s)) out[s] = 'libur tambahan';
    });
    return out;
  }

  function compute() {
    var hm = Object.assign({}, HOL, parseExtraHolidays());
    var cal = Core.makeCal(hm);
    var sched = Core.schedule(state.blocks, state.start_date, cal);
    var notes = String(state.notes || '').split(/\r?\n/).filter(function (l) { return l.trim() !== ''; });
    var model = { client_name: state.client_name, client_location: state.client_location,
                  collection: (state.collection || '').trim(), notes: notes };
    var res = Core.buildPages(model, sched, getMeasurer());
    var gw = [];
    if (!sched.start) gw.push({ level: 'err', msg: 'Isi tanggal mulai.' });
    else {
      if (Core.iso(sched.start) !== Core.iso(sched.startOriginal)) {
        gw.push({ level: 'info', msg: 'Tanggal mulai jatuh di hari non-kerja, dimajukan ke ' + Core.fmtLong(sched.start) + '.' });
      }
      var years = {}, hasYears = Object.keys(A.holidays).filter(function (k) { return k.charAt(0) !== '_'; });
      for (var y = sched.start.getUTCFullYear(); y <= sched.end.getUTCFullYear(); y++) {
        if (hasYears.indexOf(String(y)) < 0) years[y] = true;
      }
      var missing = Object.keys(years);
      if (missing.length) {
        gw.push({ level: 'warn', msg: 'Data libur nasional untuk tahun ' + missing.join(', ') + ' belum ada, hanya Sabtu dan Minggu yang dilewati. Tambahkan tanggal libur di bagian Lanjutan.' });
      }
    }
    var n = sched.rows.length;
    if (n > 20) gw.push({ level: 'warn', msg: n + ' baris: terlalu rapat dan teks bisa saling menimpa. Pecah menjadi dua timeline.' });
    else if (n > 14) gw.push({ level: 'info', msg: n + ' baris: jarak antarbaris dirapatkan otomatis.' });
    res.warnings.forEach(function (w) { gw.push({ level: 'warn', msg: w }); });
    computed = { sched: sched, res: res, model: model, gw: gw };
  }

  function paintMeta() {
    var s = computed.sched;
    // tanggal per baris
    var byId = {};
    s.rows.forEach(function (r) { byId[r.id] = r; });
    $$('[data-when]').forEach(function (el) {
      var r = byId[el.dataset.when];
      if (!r || !r.s) { el.textContent = ''; return; }
      var t;
      if (r.alt) t = Core.fmtShort(r.s) + ' atau ' + Core.fmtShort(r.alt);
      else if (r.s.getTime() === r.e.getTime()) t = Core.fmtShort(r.s);
      else t = Core.fmtShort(r.s) + ' sampai ' + Core.fmtShort(r.e);
      el.textContent = t + ' · ' + Core.workingText(r.days);
    });
    // masalah per baris
    var flat = [];
    $$('[data-issues]').forEach(function (el) {
      var list = s.issues[el.dataset.issues] || [];
      el.innerHTML = list.map(function (i) { return '<p class="iss ' + i.level + '">' + esc(i.msg) + '</p>'; }).join('');
    });
    Object.keys(s.issues).forEach(function (id) {
      s.issues[id].forEach(function (i) { flat.push({ level: i.level, msg: nameOf(id) + ': ' + i.msg }); });
    });
    var all = computed.gw.concat(flat);
    var box = $('#alerts');
    var bad = all.filter(function (a) { return a.level !== 'info'; }).length;
    $('#alert-count').textContent = bad ? bad + ' perlu dicek' : 'Jadwal aman';
    $('#alert-count').className = 'pill ' + (bad ? 'warn' : 'ok');

    // ringkasan

  var downloads = null;
  function initDownloads() {

    }
  }
  function saveFile(filename, data) {
    if (!downloads) {
      try {
        var blob = (data instanceof Blob) ? data : new Blob([data], { type: 'application/json' });
        var u = URL.createObjectURL(blob), a = document.createElement('a');
        a.href = u; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(u); }, 4000);
        status('Berkas diunduh.', 'ok'); return Promise.resolve(true);
      } catch (e) {
        status('Gagal mengunduh berkas.', 'err'); return Promise.resolve(false);
      }
    }
    return downloads.save({ filename: filename, data: data }).then(function () {
      status('Berkas dikirim ke perangkat Anda.', 'ok'); return true;
    }).catch(function (e) {
      if (e && e.code === 'declined') status('Unduhan dibatalkan.', '');
      else status('Gagal menyimpan berkas (' + (e && e.code ? e.code : 'tidak diketahui') + ').', 'err');

  function safeName(s) { return String(s || '').replace(/[\\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim(); }

  function makePdf() {
    if (!(window.jspdf && window.jspdf.jsPDF)) throw new Error('Pustaka PDF belum termuat.');
    compute();

      var blob;

      var name = 'Design Timeline - ' + (safeName(state.client_name) || 'Klien') + (state.client_location ? ' ' + safeName(state.client_location) : '') + '.pdf';

    });

      var f = e.target.dataset.f; if (!f) return;
      var host = e.target.closest('[data-id]'); var L = host && locate(host.dataset.id); if (!L) return;

      } else if (act === 'addsub') {

      } else if (act === 'pastetoggle') {

  /* ---------- fonts & gambar ---------- */
  function b64ToBytes(b) {
    var bin = atob(b), n = bin.length, a = new Uint8Array(n);
    for (var i = 0; i < n; i++) a[i] = bin.charCodeAt(i);
    return a.buffer;
  }
  function loadFonts() {
    var defs = [['Regular', '400', 'normal'], ['SemiBold', '600', 'normal'], ['Bold', '700', 'normal'], ['Italic', '400', 'italic']];
    return Promise.all(defs.map(function (d) {
      var f = new FontFace('Karla', b64ToBytes(A.fonts[d[0]]), { weight: d[1], style: d[2] });
      return f.load().then(function (ff) { document.fonts.add(ff); });
    })).catch(function () { /* fallback ke font sistem */ });
  }
  function loadImages() {
    return Promise.all(Object.keys(A.images).map(function (k) {
      return new Promise(function (res) {
        var im = new Image(); im.onload = function () { images[k] = im; res(); }; im.onerror = res;
        im.src = 'data:image/jpeg;base64,' + A.images[k];
      });
    }));
  }

  /* ---------- mulai ---------- */
  function init() {
    loadDraft();
    syncFields(); wire(); syncUndo(); initDownloads();
    renderAll();
    Promise.all([loadFonts(), loadImages()]).then(function () { update(); });
    // jsPDF dimuat dari CDN: ukur ulang setelah siap
    var tries = 0, iv = setInterval(function () {
      if (window.jspdf && window.jspdf.jsPDF) { clearInterval(iv); $('#btn-pdf').disabled = false; update(); }
      else if (++tries > 100) { clearInterval(iv); status('Pustaka PDF gagal dimuat. Muat ulang halaman.', 'err'); }
    }, 100);
    window.__tl = { makePdf: makePdf, get state() { return state; }, compute: compute, get computed() { return computed; } };
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
</body>
</html>
